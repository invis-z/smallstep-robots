name: Check Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  check-update:
    name: Check Update
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-upstream-release.outputs.release }}
      need_update: ${{ steps.newer.outputs.need_update }}
      prerelease: ${{ steps.get-upstream-release.outputs.prerelease }}
    steps:
      - name: Get Upstream release
        id: get-upstream-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ vars.UPSTREAM_REPO }}"
          
          # Get the latest non-draft release
          RELEASE_INFO=$(gh release list \
            --repo "$REPO" \
            --exclude-drafts \
            --limit 1 \
            --json tagName,isPrerelease,isDraft)
          
          RELEASE=$(echo "$RELEASE_INFO" | jq -r '.[0].tagName')
          PRERELEASE=$(echo "$RELEASE_INFO" | jq -r '.[0].isPrerelease')
          
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Get latest release
        id: get-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ vars.TARGET_REPO }}"
          
          # Get the latest non-draft release
          RELEASE_INFO=$(gh release list \
            --repo "$REPO" \
            --exclude-drafts \
            --limit 1 \
            --json tagName,isPrerelease,isDraft)
          
          RELEASE=$(echo "$RELEASE_INFO" | jq -r '.[0].tagName')
          PRERELEASE=$(echo "$RELEASE_INFO" | jq -r '.[0].isPrerelease')
          
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Version is different
        if: ${{ steps.get-upstream-release.outputs.release != steps.get-release.outputs.release }}
        id: newer
        run: |
          echo need_update=true >> "$GITHUB_OUTPUT"

  patch:
    name: Patch
    needs: check-update
    if: ${{ needs.check-update.outputs.need_update  == 'true' }}
    uses: invis-z/smallstep-robots/.github/workflows/patch.yaml@workflows
    secrets: 
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      version: ${{ needs.check-update.outputs.version }}
      prerelease: ${{ needs.check-update.outputs.prerelease == 'true' }}
      src-repo: ${{ vars.UPSTREAM_REPO }}
      repo: ${{ vars.TARGET_REPO }}
      patch-repo: ${{ vars.PATCH_REPO }}
      patch-ref: ${{ vars.PATCH_REF }}
      branch: "release"

  build:
    name: Build
    needs: [check-update, patch]
    if: ${{ needs.check-update.outputs.need_update  == 'true' && needs.check-update.outputs.prerelease == 'false' }}
    uses: invis-z/smallstep-robots/.github/workflows/build.yaml@workflows
    secrets: 
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      version: ${{ needs.check-update.outputs.version }}
      repo: ${{ vars.TARGET_REPO }}

  clean-history:
    name: Clean History
    needs: check-update
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Clean old runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_NAME=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          echo "Cleaning old $WORKFLOW_NAME runs"
          RUNS=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_NAME/runs" \
            --paginate \
            --jq ".workflow_runs[] | select(.created_at | fromdateiso8601 < $(date -d 'last month' +%s)) | .id")

          for RUN in $RUNS; do
            echo "Deleting run $RUN"
            gh api --silent --method DELETE \
              "/repos/${{ github.repository }}/actions/runs/$RUN" || true
            sleep 0.1
          done
